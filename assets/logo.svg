<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" role="img" aria-label="PointNow">
  <!-- Horizontal lockup. The glyph is the rosette reduced to three passes;
       the amber centre is the reading. Set in Archivo, weight 620, width 112.
       Text is drawn as text so it stays crisp and editable — if this needs to
       travel anywhere the font is not installed, outline it first. -->
  <g fill="none" stroke="#2B3DF5" stroke-width="2.1">
    <circle cx="24" cy="18.6" r="10.4" opacity=".95"/>
    <circle cx="18.2" cy="28.6" r="10.4" opacity=".55"/>
    <circle cx="29.8" cy="28.6" r="10.4" opacity=".55"/>
  </g>
  <circle cx="24" cy="24" r="3" fill="#E8A02E"/>
  <text x="52" y="32"
        font-family="Archivo, Arial, sans-serif"
        font-size="26" font-weight="620" font-stretch="112%"
        letter-spacing="-0.8" fill="#15181A">Point<tspan fill="#2B3DF5">Now</tspan></text>
</svg>
